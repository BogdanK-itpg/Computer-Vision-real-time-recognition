[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "computer_vision"
version = "0.1.0"
description = "Production-ready computer vision application using MediaPipe Tasks API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
